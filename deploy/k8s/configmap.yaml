apiVersion: v1
kind: ConfigMap
metadata:
  name: greenroute-config
data:
  GREENROUTE_MOCK_BEDROCK: "false"
  GREENROUTE_AWS_REGION: eu-north-1
  GREENROUTE_TIERS_FILE: config/tiers.yaml
  GREENROUTE_CARBON_ZONE: SE-SE3
  GREENROUTE_JUDGE_ENABLED: "true"
  GREENROUTE_JUDGE_TIER: "1"
  GREENROUTE_QUALITY_THRESHOLD: "7"
  GREENROUTE_PUE: "1.15"
  GREENROUTE_REDIS_URL: redis://greenroute-redis:6379/0
  GREENROUTE_SCHEDULER_INTERVAL_SECONDS: "60"
  GREENROUTE_DEFAULT_DEADLINE_HOURS: "24"
